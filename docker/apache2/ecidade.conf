<VirtualHost *:80>
		SetEnvIf X-Forwarded-Proto https HTTPS=ON

        ServerAdmin webmaster@localhost

        LimitRequestLine 16382
        LimitRequestFieldSize 16382
        Timeout 12000
        AddDefaultCharset ISO-8859-1
        SetEnv no-gzip 1

        DocumentRoot /var/www/html
        <Directory />
                Options FollowSymLinks
                AllowOverride None
        </Directory>
        <Directory /var/www/html>
                Options FollowSymLinks MultiViews
                AllowOverride All
                Order allow,deny
                allow from all
        </Directory>

        # Rota fixa para o endpoint BCI
        Alias /bci /var/www/html/bci.php

        ScriptAlias /cgi-bin/ /usr/lib/cgi-bin/
        <Directory "/usr/lib/cgi-bin">
                AllowOverride None
                Options +ExecCGI -MultiViews +SymLinksIfOwnerMatch
                Order allow,deny
                Allow from all
        </Directory>

        ErrorLog ${APACHE_LOG_DIR}/error.log

        # Possible values include: debug, info, notice, warn, error, crit,
        # alert, emerg.
        LogLevel warn

        CustomLog ${APACHE_LOG_DIR}/access.log combined

    Alias /doc/ "/usr/share/doc/"
    <Directory "/usr/share/doc/">
        Options Indexes MultiViews FollowSymLinks
				AllowOverride None
        Order deny,allow
        Deny from all
        Allow from 127.0.0.0/255.0.0.0 ::1/128
    </Directory>

    # Nunca expor via web os arquivos de infraestrutura (dados do PostgreSQL ficam
    # em docker/bd/pgsql, dentro da raiz do site), o repositório git e o .env
    <DirectoryMatch "^/var/www/html/(docker|\.git)(/|$)">
        Require all denied
    </DirectoryMatch>
    <FilesMatch "^\.env">
        Require all denied
    </FilesMatch>



</VirtualHost>

